name: Poise
options:
  bundleIdPrefix: com.koliokolev
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  PoiseKit:
    path: Packages/PoiseKit
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.55.0"
  LinkKit:
    url: https://github.com/plaid/plaid-link-ios
    from: "7.1.0"

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: D6937U28B4
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
  configs:
    Release:
      SWIFT_OPTIMIZATION_LEVEL: -O
      COPY_PHASE_STRIP: YES
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

targets:
  Poise:
    type: application
    platform: iOS
    sources:
      - path: App/Poise
    dependencies:
      - package: PoiseKit
        product: PoiseKit
      - package: Supabase
        product: Supabase
      - package: LinkKit
        product: LinkKit
      - sdk: FinanceKit.framework
    info:
      path: App/Poise/Info.plist
      properties:
        CFBundleName: Poise
        CFBundleDisplayName: Poise
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: Poise uses Face ID to keep your finances private when you open the app.
        NSFinancialDataUsageDescription: Poise reads your Apple Card, Apple Cash and Savings activity from Wallet so it counts alongside your other accounts. It stays in your own private record and is never sold or shared.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    entitlements:
      path: App/Poise/Poise.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        com.apple.developer.associated-domains: ["applinks:kkolev.com"]
        com.apple.developer.financekit: [financial-data]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.koliokolev.poise
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic

schemes:
  Poise:
    build:
      targets:
        Poise: all
    run:
      config: Debug
    test:
      config: Debug

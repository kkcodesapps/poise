name: Poise
options:
  bundleIdPrefix: com.koliokolev
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  PoiseKit:
    path: Packages/PoiseKit
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.55.0"
  LinkKit:
    url: https://github.com/plaid/plaid-link-ios
    from: "7.1.0"

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: D6937U28B4
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.4"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
  configs:
    Release:
      SWIFT_OPTIMIZATION_LEVEL: -O
      COPY_PHASE_STRIP: YES
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

targets:
  Poise:
    type: application
    platform: iOS
    sources:
      - path: App/Poise
      - path: App/Shared
    dependencies:
      - package: PoiseKit
        product: PoiseKit
      - package: Supabase
        product: Supabase
      - package: LinkKit
        product: LinkKit
      - sdk: FinanceKit.framework
      - target: PoiseWidgets
        embed: true
      - target: PoiseFinance
        embed: true
    info:
      path: App/Poise/Info.plist
      properties:
        CFBundleName: Poise
        CFBundleDisplayName: Poise
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: Poise uses Face ID to keep your finances private when you open the app.
        NSFinancialDataUsageDescription: Poise reads your Apple Card, Apple Cash and Savings activity from Wallet so it counts alongside your other accounts. It stays in your own private record and is never sold or shared.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleURLTypes:
          - CFBundleURLName: com.koliokolev.poise
            CFBundleURLSchemes: [poise]
    entitlements:
      path: App/Poise/Poise.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        com.apple.developer.associated-domains: ["applinks:kkolev.com"]
        com.apple.developer.financekit: [financial-data]
        aps-environment: development
        com.apple.security.application-groups: [group.com.koliokolev.poise]
        keychain-access-groups: [$(AppIdentifierPrefix)com.koliokolev.poise]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.koliokolev.poise
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
      configs:
        Debug:
          # Device builds sign with profiles minted by Tools/profiles.js (App Store Connect API); see Tools/device.sh.
          "CODE_SIGN_STYLE[sdk=iphoneos*]": Manual
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Development
          "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": Poise Dev
        Release:
          "CODE_SIGN_STYLE[sdk=iphoneos*]": Manual
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Distribution
          "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": Poise Dist

  PoiseWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: App/PoiseWidgets
      - path: App/Shared
      - path: App/Poise/Theme.swift
    info:
      path: App/PoiseWidgets/Info.plist
      properties:
        CFBundleDisplayName: Poise
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: App/PoiseWidgets/PoiseWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.koliokolev.poise]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.koliokolev.poise.widgets
        SKIP_INSTALL: YES
        INFOPLIST_KEY_CFBundleDisplayName: Poise
      configs:
        Debug:
          "CODE_SIGN_STYLE[sdk=iphoneos*]": Manual
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Development
          "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": Poise Widgets Dev
        Release:
          "CODE_SIGN_STYLE[sdk=iphoneos*]": Manual
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Distribution
          "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": Poise Widgets Dist

  # FinanceKit background delivery: the system launches this (app closed) when Wallet changes; it runs the same
  # WalletSource sync on the app's session, shared through the keychain group. App Store Connect refuses a build whose
  # extension lacks the FinanceKit entitlement, so Tools/device.sh and Tools/testflight.sh leave the extension out
  # entirely (see their "pending" spec) until the profile carries the capability.
  PoiseFinance:
    type: extensionkit-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: App/PoiseFinance
      - path: App/Poise/Services/Wallet.swift
      - path: App/Poise/Services/Backend.swift
    dependencies:
      - package: Supabase
        product: Supabase
      - sdk: FinanceKit.framework
    info:
      path: App/PoiseFinance/Info.plist
      properties:
        CFBundleDisplayName: Poise Finance
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.financekit.background-delivery
    entitlements:
      path: App/PoiseFinance/PoiseFinance.entitlements
      properties:
        com.apple.developer.financekit: [financial-data]
        keychain-access-groups: [$(AppIdentifierPrefix)com.koliokolev.poise]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.koliokolev.poise.finance
        SKIP_INSTALL: YES
      configs:
        Debug:
          "CODE_SIGN_STYLE[sdk=iphoneos*]": Manual
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Development
          "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": Poise Finance Dev
        Release:
          "CODE_SIGN_STYLE[sdk=iphoneos*]": Manual
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Distribution
          "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": Poise Finance Dist

schemes:
  Poise:
    build:
      targets:
        Poise: all
    run:
      config: Debug
    test:
      config: Debug
